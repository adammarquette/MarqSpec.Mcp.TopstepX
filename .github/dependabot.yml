version: 2

updates:
  # NuGet. Versions live in Directory.Packages.props (central package management), which Dependabot
  # understands — a bump lands in that one file rather than in each csproj.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    open-pull-requests-limit: 5
    target-branch: develop
    labels:
      - work:platform
      - "Work Estimate: 1"
    commit-message:
      prefix: build
      include: scope
    groups:
      # The Microsoft.Extensions.* packages move together; separate PRs for each would produce the version
      # split this repo just finished resolving.
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      test-stack:
        patterns:
          - "xunit*"
          - "coverlet.*"
          - "Microsoft.NET.Test.Sdk"
    ignore:
      # LICENSE CAP: FluentAssertions v8+ is commercially licensed. Do not let a bot walk into that.
      - dependency-name: "FluentAssertions"
        versions: [">=8.0.0"]

  # The CDK CLI that `cdk synth` runs through in CI, pinned in infra/package.json (gh#516). The constructs
  # are the Amazon.CDK.Lib NuGet package above, and the two move on separate trains: a CLI older than the
  # library's cloud-assembly schema refuses to synthesise, so a bump here that lands before the NuGet one is
  # harmless and the reverse is a red `build & unit tests` naming the schema version -- which is the right
  # place to find out.
  - package-ecosystem: npm
    directory: "/infra"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    open-pull-requests-limit: 2
    target-branch: develop
    labels:
      - work:platform
      - "Work Estimate: 1"
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    open-pull-requests-limit: 3
    target-branch: develop
    labels:
      - work:platform
      - "Work Estimate: 1"
    commit-message:
      prefix: ci
      include: scope
