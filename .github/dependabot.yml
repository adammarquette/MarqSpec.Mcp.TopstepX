version: 2

updates:
  # NuGet. Versions live in Directory.Packages.props (central package management), which Dependabot
  # understands — a bump lands in that one file rather than in each csproj.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    open-pull-requests-limit: 5
    target-branch: develop
    labels:
      - work:platform
      - "Work Estimate: 1"
    commit-message:
      prefix: build
      include: scope
    groups:
      # The Microsoft.Extensions.* packages move together; separate PRs for each would produce the version
      # split this repo just finished resolving.
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      test-stack:
        patterns:
          - "xunit*"
          - "coverlet.*"
          - "Microsoft.NET.Test.Sdk"
    ignore:
      # LICENSE CAP: FluentAssertions v8+ is commercially licensed. Do not let a bot walk into that.
      - dependency-name: "FluentAssertions"
        versions: [">=8.0.0"]

  # The pinned Railway SDK + TypeScript the railway-template CI job compiles .railway/railway.ts against
  # (gh#758), and the root package.json that `railway config plan` loads the same SDK from. CI/deploy only;
  # nothing here ships in the image. The group keeps both railway pins in one PR, because the deploy
  # workflows refuse to run when they differ.
  - package-ecosystem: npm
    directories:
      - "/"
      - "/scripts/railway"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    open-pull-requests-limit: 2
    target-branch: develop
    labels:
      - work:platform
      - "Work Estimate: 1"
    commit-message:
      prefix: ci
      include: scope
    groups:
      railway-sdk:
        patterns:
          - "railway"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    open-pull-requests-limit: 3
    target-branch: develop
    labels:
      - work:platform
      - "Work Estimate: 1"
    commit-message:
      prefix: ci
      include: scope
