name: Branch policy

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]
  merge_group:

# NO concurrency block, deliberately (gh#26, then gh#798).
#
# gh#26 set cancel-in-progress: false, believing that stopped cancellation. It does not: a concurrency group
# holds ONE running and ONE pending run, and a newer pending run REPLACES (cancels) the older pending one even
# with cancel-in-progress false. Dependabot opens a PR with two labels, so `opened`, `labeled`, `labeled`
# arrive within a second: run 1 starts, run 2 queues, run 3 cancels run 2. The cancelled suite has no check
# runs, and when it is the newest suite the ruleset reports commit-hygiene and issue-link as "expected" (merge
# API 405) although both are green elsewhere. Seen on runs 40157262214 and 40157054142 (attempt 1 cancelled).
#
# Every job here is a read-only check that finishes in seconds, so letting each event's run complete costs
# nothing and leaves every suite on the head sha complete. Do not re-add a group keyed on ref or PR number.
#
# Debugging an empty or 'expected' required check: `gh pr checks` reports the latest run per name and shows
# green, so it HIDES a cancelled required check (gh#26). List the commit's check-suites via `gh api` instead.

permissions:
  contents: read
  pull-requests: read

jobs:
  # Enforces the one-way promotion ladder from CONTRIBUTING.md. Required on staging and main.
  ladder:
    name: ladder
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate the base/head pair
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          echo "$HEAD ($HEAD_REPO) -> $BASE"

          # Checked BEFORE the branch name, and deliberately: a fork branch merely NAMED staging is a
          # different lineage, and no label may excuse a foreign repository.
          if [ "$BASE" = "staging" ] || [ "$BASE" = "main" ]; then
            if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
              echo "::error::A promotion into '$BASE' must come from a branch in $THIS_REPO, not $HEAD_REPO."
              echo "::error::Fork contributions go to develop, which carries no ladder constraint."
              exit 1
            fi
          fi

          case "$BASE" in
            main)
              # No exception exists for main, on purpose. Release history stays single-source.
              if [ "$HEAD" != "staging" ]; then
                echo "::error::'main' accepts only 'staging'. Got '$HEAD'."
                echo "::error::There is no ladder-exception for main — promote through staging."
                exit 1
              fi
              ;;
            staging)
              if [ "$HEAD" = "develop" ]; then
                exit 0
              fi
              if echo "$LABELS" | tr ',' '\n' | grep -qx 'ladder-exception'; then
                echo "::notice::Non-standard source '$HEAD' allowed by the ladder-exception label."
                exit 0
              fi
              echo "::error::'staging' accepts only 'develop'. Got '$HEAD'."
              echo "::error::State the reason in the PR and add the 'ladder-exception' label to override."
              exit 1
              ;;
            *)
              echo "No ladder constraint on '$BASE'."
              ;;
          esac

  # Required everywhere. The repo rebase-merges, so every commit on the branch reaches develop by name.
  commit-hygiene:
    name: commit-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # fetch-depth: 0 is LOAD-BEARING here, and this is the one job in the repository whose need for full
          # history has nothing to do with MinVer -- it installs no SDK and builds nothing. Both steps below
          # resolve a commit RANGE, which a shallow clone cannot do: at depth 1 the pull request's base SHA is
          # simply not in the clone. Trimming this line used to be silent (gh#164); it is now a red run that
          # names the range, so read the failure rather than restoring the depth blind.
          fetch-depth: 0

      # gh#146. Runs BEFORE the subject check, and that order is deliberate: a merge commit makes the branch
      # unmergeable outright, so it is the finding the author has to act on first — and the rebase that fixes
      # it carries every subject through unchanged, so nothing is lost by reporting it alone. Note that the
      # subject check below passes `--no-merges`, so a merge commit is invisible to it; without this step the
      # job's name promises hygiene it does not check.
      #
      # Scoped to a pull request into `develop`, which is the only rung that is rebase-merge-only
      # (`protect-develop`, allowed_merge_methods ["rebase"]). `staging` and `main` are the opposite —
      # merge-commit-only — and a promotion into them legitimately carries merge commits: PR #129's real
      # range (5d56e7a..2eb2c42) contained one, so an unguarded version of this step would have failed a
      # promotion that was correct. Do not widen the guard.
      #
      # `merge_group` is left out on purpose: no merge queue is enabled on this repo, and the shape of a
      # queue branch under a rebase-only method has never been observed here. The mistake is made on the
      # branch, and this catches it there.
      #
      # Watched fail and watched pass, both on the shape that ships: runs 32762584560 (base `develop`, red on
      # a real merge commit) and 32762704728 (the SAME head sha, base `staging`, step skipped and the job
      # green), plus 32765717336 — this step's own PR, where it ran against a linear branch and passed. The
      # throwaways behind the first two are deleted, so those ids are the only trail back to them.
      - name: Refuse a merge commit on a PR into develop
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          RANGE="${BASE_SHA}..${HEAD_SHA}"

          # Assigned on its own line, NOT inlined into the `if`. A command substitution inside an `if`
          # condition is exempt from `set -e`, so `if [ -z "$(git rev-list ... )" ]` reports "ok" when git
          # FAILED to resolve the range -- a gate reporting clean precisely when it checked nothing. As a
          # plain assignment the exit status is git's, and the step dies instead.
          merges="$(git rev-list --merges "$RANGE")"

          if [ -z "$merges" ]; then
            echo "ok  no merge commit in $RANGE."
            exit 0
          fi

          git log --merges --format='::error::merge commit %h %s' "$RANGE"
          echo "::error::'develop' accepts REBASE-MERGE ONLY, and GitHub's 'Rebase and merge' cannot replay a"
          echo "::error::merge commit. Left as is, this PR will show 'All checks have passed' beside 'Unable to"
          echo "::error::merge (rebase) — Cannot merge at this time', naming nothing. That is this failure."
          echo "::error::Fix: git fetch origin && git rebase origin/develop && git push --force-with-lease"
          echo "::error::A plain rebase drops the merge commits; conflicts resolved inside one are re-resolved."
          echo "::error::The 'Update branch' button MERGES by default — use its dropdown's 'Update with rebase'."
          exit 1

      # gh#164. THE RANGE IS READ AND CHECKED BEFORE IT IS SPLIT, and the zero-subject asymmetry below is
      # deliberately left alone. Two different questions, and conflating them is what this card is about:
      #
      #   "I could not read this range"          -> fatal on BOTH arms. Nothing was checked.
      #   "I read it and it has no commits"      -> merge_group refuses, pull_request accepts. Unchanged.
      #
      # The second line is a RECORDED PRIOR DECISION, not an oversight: a pull request legitimately can carry
      # no non-merge commit, a merge group cannot. Do not collapse the two arms onto one verdict.
      #
      # What was wrong: `mapfile -t subjects < <(git log ...)`. A process substitution's exit status is never
      # examined by the shell, so a failed `git log` left `subjects` empty, `set -euo pipefail` never fired,
      # and the pull_request arm printed "No non-merge commits to check." and exited 0 -- a context required
      # on all three rungs reporting green having read nothing. Fourth instance of one mechanism here; the
      # five shapes are tabulated and measured on two bash versions in gh#126's PR #156, and in the platform
      # contract's "Constraints that bite in CI". Cite that table rather than re-deriving it.
      #
      # And the green half, on the input this actually meets: 32878612262, gh#164's own pull request at
      # 3bad637, base `develop` and linear, where BOTH steps ran rather than being skipped and both passed --
      # the merge check printing `ok  no merge commit in ...` and this one naming all five subjects.
      #
      # WHERE IT WAS REACHABLE. On a pull request into `develop` the merge-commit step above already dies on
      # an unresolvable range -- it assigns `git rev-list` plainly, so `set -e` carries git's 128 -- and
      # merge_group already refused zero subjects. So the vacuous pass was reachable on exactly the PROMOTION
      # rungs, `staging` and `main`, where that step is skipped by its base guard. That is why the mutation
      # probes below are based on `staging`: a `develop` base cannot show this defect at all (run 32857116130,
      # a linear head at depth 1 into `develop`, dies at the step above with this one SKIPPED).
      #
      # PROVEN BY MUTATION, not argued -- a check that could pass having read nothing is not repaired by an
      # argument. Throwaway runs, all now closed with their branches deleted, so these ids are the only trail
      # back; the same table with its printed output is in the platform contract beside this job:
      #
      #   32854350754  `mapfile < <(...)`, depth 1     -> commit-hygiene SUCCESS. "No non-merge commits ..."
      #   32874228812  this read, depth 1              -> failure. "git log exited 128 for '<range>'"
      #   32876371775  this read, a merge-ONLY range   -> success. "No non-merge commits to check."
      #   32876613013  this read, EVENT pinned m_group -> failure. "Refusing to pass vacuously."
      #   32876328853  a CAPTURE, oldest subject empty -> SUCCESS, one subject checked and the empty one
      #                                                   never seen. The review finding, measured.
      #   32876350211  this read, the same fixture     -> failure. "Not a Conventional Commit subject: ''"
      #   32855936278  a real merge commit, develop    -> failure at the step ABOVE, naming it (gh#146)
      #   32857116130  linear, depth 1, develop        -> failure at the step ABOVE, on git's 128
      #
      # Rows 1/2 and rows 5/6 are two before-and-after pairs, each differing ONLY in this file, which is what
      # makes them measurements rather than descriptions. Rows 3 and 4 are the two halves of the asymmetry,
      # each on the input it exists for. The last two decide at the step above, which this card never
      # touched. No merge queue is enabled here, so a real merge_group event cannot be produced: row 4 pins
      # EVENT in the throwaway instead, which proves the arm's code on its own input and not the event that
      # would deliver it.
      - name: Check commit subjects
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          TYPES='build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test'

          if [ "$EVENT" = "merge_group" ]; then
            RANGE="${MG_BASE}..${MG_HEAD}"
          else
            RANGE="${BASE_SHA}..${HEAD_SHA}"
          fi

          # --no-merges: a merge commit's subject is GitHub's, not the author's.
          #
          # WRITTEN TO A FILE RATHER THAN CAPTURED IN A VARIABLE, and that is not incidental. `$(...)` strips
          # TRAILING newlines, and `git log` prints newest-first -- so the OLDEST commit in the range is the
          # last line, and if its subject is EMPTY (`git commit --allow-empty-message`, the least conventional
          # subject there is) the capture drops it. When it was the only commit in the range, the step then
          # fell into the zero-subject arm below and PASSED. That is this card's own defect rebuilt one size
          # smaller; it was written and caught in review before it shipped. A redirection copies the stream
          # byte for byte, so the split below sees exactly what the process substitution saw.
          subjects_file="${RUNNER_TEMP}/commit-subjects"
          log_status=0
          git log --no-merges --format=%s "$RANGE" >"$subjects_file" || log_status=$?
          if [ "$log_status" -ne 0 ]; then
            echo "::error::git log exited $log_status for '$RANGE'. No commit was read, so this check has no"
            echo "::error::verdict to give - failing rather than reporting on a range it could not open."
            echo "::error::The usual cause is a shallow clone: this job needs fetch-depth: 0, being the ONE"
            echo "::error::job here that needs full history for something other than MinVer."
            exit 1
          fi

          # A plain redirection, NOT a process substitution: if the file cannot be opened the builtin itself
          # fails and `set -e` stops the step, where `< <(cmd)` would run the loop zero times and fall
          # through to the success path. Nothing is skipped on an empty file -- mapfile yields zero elements
          # from it, exactly as it did from an empty stream.
          mapfile -t subjects <"$subjects_file"

          # Below this line is UNCHANGED and stays unchanged: a read that SUCCEEDED and found nothing.
          if [ "${#subjects[@]}" -eq 0 ]; then
            if [ "$EVENT" = "merge_group" ]; then
              echo "::error::Resolved zero commits for '$RANGE'. Refusing to pass vacuously."
              exit 1
            fi
            echo "No non-merge commits to check."
            exit 0
          fi

          failed=0
          for subject in "${subjects[@]}"; do
            if echo "$subject" | grep -qE '^(fixup!|squash!|amend!|wip\b)'; then
              echo "::error::Leftover work-in-progress commit: '$subject'"
              echo "::error::Interactive-rebase the branch into units of work before merging."
              failed=1
              continue
            fi

            if echo "$subject" | grep -qE "^Revert \"|^(${TYPES})(\([[:alnum:]._/-]+\))?!?: .+"; then
              echo "ok  $subject"
            else
              echo "::error::Not a Conventional Commit subject: '$subject'"
              echo "::error::Expected '<type>(<scope>): <description>' with type one of: ${TYPES//|/, }"
              failed=1
            fi
          done

          exit "$failed"

      # gh#802. AI-assisted commits carry `Assisted-by: <model>:<version>` (CONTRIBUTING.md, *AI-assisted
      # commits*). Judged by AUTHOR date (survives a rebase): before 2026-10-25 00:00 CDT skipped; until 12:36 CDT
      # the interim `<Name> (<tool>)` + Co-Authored-By rule; from 12:36 CDT the `<model>:<version>` rule. Commits
      # without a parsed `Assisted-by:` (Dependabot included) are untouched. Logic and cases live in the script and
      # its self-test, run by ci.yml.
      # gh#827. The gate runs the BASE commit's copy of scripts/check-commit-trailers.sh, never the PR's: a PR that edits a gating
      # script is judged by the copy already merged, and its change takes effect for gating only after it merges.
      # merge_group takes the queue's base_sha, never the moving tip of develop. FAIL CLOSED: no base copy (a PR
      # adding a new gating script) or no fetch is a red step, never a skip and never a fall back to the PR's copy.
      # The self-tests in ci.yml keep running the PR's own copy. The script sources no helper from scripts/.
      - name: Fetch scripts/check-commit-trailers.sh from the base commit
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          SCRIPT: scripts/check-commit-trailers.sh
        run: |
          set -euo pipefail
          if [ "$EVENT" = "merge_group" ]; then base="$MG_BASE"; else base="$PR_BASE"; fi
          if [ -z "$base" ]; then
            echo "::error::No base sha for event '$EVENT'; cannot fetch the base copy of $SCRIPT. Failing closed."
            exit 1
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base" || true
          fi
          mkdir -p "$RUNNER_TEMP/gate"
          out="$RUNNER_TEMP/gate/$(basename "$SCRIPT")"
          if ! git show "${base}:${SCRIPT}" >"$out" 2>/dev/null || [ ! -s "$out" ]; then
            echo "::error::Could not read $SCRIPT at base commit $base. The gate runs the BASE copy only and never"
            echo "::error::falls back to this PR's copy. A PR that ADDS a new gating script has no base copy and"
            echo "::error::needs a one-time manual gate by a maintainer (CONTRIBUTING.md, 'Gating scripts')."
            exit 1
          fi
          chmod +x "$out"
          echo "ok  $SCRIPT from base $base ($(git rev-parse --short "$base"))."
      - name: Check AI-assistance trailers
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        # No argument: the script derives the range from this env (exercised by its self-test, merge_group too).
        run: '"$RUNNER_TEMP/gate/check-commit-trailers.sh"'

  # ENFORCING, as of gh#35. It used to be advisory by construction -- continue-on-error, no `set -e`, every
  # branch ending in `exit 0` -- so it reported success on a PR citing no issue at all. The platform contract's
  # own rule applies: a gate that cannot fail is not a gate, and one named like enforcement while providing
  # none is worse than none, because it is believed.
  issue-link:
    name: issue-link
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Logic, rule and history live in the script; its self-test (ci.yml) proves each verdict by name (gh#824).
      # The checkout is the PR's merge ref, but the script run is the BASE commit's copy (gh#827).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # gh#827: full history so the base sha is present for the base-copy fetch below.
          fetch-depth: 0
      # gh#827. The gate runs the BASE commit's copy of scripts/check-issue-link.sh, never the PR's: a PR that edits a gating
      # script is judged by the copy already merged, and its change takes effect for gating only after it merges.
      # merge_group takes the queue's base_sha, never the moving tip of develop. FAIL CLOSED: no base copy (a PR
      # adding a new gating script) or no fetch is a red step, never a skip and never a fall back to the PR's copy.
      # The self-tests in ci.yml keep running the PR's own copy. The script sources no helper from scripts/.
      - name: Fetch scripts/check-issue-link.sh from the base commit
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          SCRIPT: scripts/check-issue-link.sh
        run: |
          set -euo pipefail
          if [ "$EVENT" = "merge_group" ]; then base="$MG_BASE"; else base="$PR_BASE"; fi
          if [ -z "$base" ]; then
            echo "::error::No base sha for event '$EVENT'; cannot fetch the base copy of $SCRIPT. Failing closed."
            exit 1
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base" || true
          fi
          mkdir -p "$RUNNER_TEMP/gate"
          out="$RUNNER_TEMP/gate/$(basename "$SCRIPT")"
          if ! git show "${base}:${SCRIPT}" >"$out" 2>/dev/null || [ ! -s "$out" ]; then
            echo "::error::Could not read $SCRIPT at base commit $base. The gate runs the BASE copy only and never"
            echo "::error::falls back to this PR's copy. A PR that ADDS a new gating script has no base copy and"
            echo "::error::needs a one-time manual gate by a maintainer (CONTRIBUTING.md, 'Gating scripts')."
            exit 1
          fi
          chmod +x "$out"
          echo "ok  $SCRIPT from base $base ($(git rev-parse --short "$base"))."
      - name: Check the issue reference
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: '"$RUNNER_TEMP/gate/check-issue-link.sh"'
