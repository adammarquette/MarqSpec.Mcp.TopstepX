# PROBE BRANCH FOR gh#101 — DO NOT MERGE. Exists only to observe issue-link against a promotion base.
name: Branch policy

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]
  merge_group:

concurrency:
  group: branch-policy-${{ github.ref }}
  # cancel-in-progress is FALSE deliberately (gh#26).
  #
  # A cancelled run leaves its check-runs in CANCELLED on the commit, and a cancelled REQUIRED check blocks the
  # merge -- while `gh pr checks` reports the latest run per name and shows green, so the block is invisible
  # from the tool anyone reaches for first.
  #
  # It fires easily: this workflow triggers on `labeled`, so opening a PR with a label in the same call
  # produces `opened` and `labeled` together, two pull_request events on the same ref, and one cancels the
  # other. Which one survives is a race.
  #
  # Grouping on the PR number instead does NOT fix it -- that still cancels, and the cancelled run still leaves
  # cancelled checks. Letting a superseded run finish is the cheap half of this trade.
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  # Enforces the one-way promotion ladder from CONTRIBUTING.md. Required on staging and main.
  ladder:
    name: ladder
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate the base/head pair
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          echo "$HEAD ($HEAD_REPO) -> $BASE"

          # Checked BEFORE the branch name, and deliberately: a fork branch merely NAMED staging is a
          # different lineage, and no label may excuse a foreign repository.
          if [ "$BASE" = "staging" ] || [ "$BASE" = "main" ]; then
            if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
              echo "::error::A promotion into '$BASE' must come from a branch in $THIS_REPO, not $HEAD_REPO."
              echo "::error::Fork contributions go to develop, which carries no ladder constraint."
              exit 1
            fi
          fi

          case "$BASE" in
            main)
              # No exception exists for main, on purpose. Release history stays single-source.
              if [ "$HEAD" != "staging" ]; then
                echo "::error::'main' accepts only 'staging'. Got '$HEAD'."
                echo "::error::There is no ladder-exception for main — promote through staging."
                exit 1
              fi
              ;;
            staging)
              if [ "$HEAD" = "develop" ]; then
                exit 0
              fi
              if echo "$LABELS" | tr ',' '\n' | grep -qx 'ladder-exception'; then
                echo "::notice::Non-standard source '$HEAD' allowed by the ladder-exception label."
                exit 0
              fi
              echo "::error::'staging' accepts only 'develop'. Got '$HEAD'."
              echo "::error::State the reason in the PR and add the 'ladder-exception' label to override."
              exit 1
              ;;
            *)
              echo "No ladder constraint on '$BASE'."
              ;;
          esac

  # Required everywhere. The repo rebase-merges, so every commit on the branch reaches develop by name.
  commit-hygiene:
    name: commit-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check commit subjects
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          TYPES='build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test'

          if [ "$EVENT" = "merge_group" ]; then
            RANGE="${MG_BASE}..${MG_HEAD}"
          else
            RANGE="${BASE_SHA}..${HEAD_SHA}"
          fi

          # --no-merges: a merge commit's subject is GitHub's, not the author's.
          mapfile -t subjects < <(git log --no-merges --format=%s "$RANGE")

          if [ "${#subjects[@]}" -eq 0 ]; then
            if [ "$EVENT" = "merge_group" ]; then
              echo "::error::Resolved zero commits for '$RANGE'. Refusing to pass vacuously."
              exit 1
            fi
            echo "No non-merge commits to check."
            exit 0
          fi

          failed=0
          for subject in "${subjects[@]}"; do
            if echo "$subject" | grep -qE '^(fixup!|squash!|amend!|wip\b)'; then
              echo "::error::Leftover work-in-progress commit: '$subject'"
              echo "::error::Interactive-rebase the branch into units of work before merging."
              failed=1
              continue
            fi

            if echo "$subject" | grep -qE "^Revert \"|^(${TYPES})(\([[:alnum:]._/-]+\))?!?: .+"; then
              echo "ok  $subject"
            else
              echo "::error::Not a Conventional Commit subject: '$subject'"
              echo "::error::Expected '<type>(<scope>): <description>' with type one of: ${TYPES//|/, }"
              failed=1
            fi
          done

          exit "$failed"

  # ENFORCING, as of gh#35. It used to be advisory by construction -- continue-on-error, no `set -e`, every
  # branch ending in `exit 0` -- so it reported success on a PR citing no issue at all. The platform contract's
  # own rule applies: a gate that cannot fail is not a gate, and one named like enforcement while providing
  # none is worse than none, because it is believed.
  issue-link:
    name: issue-link
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the issue reference
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # Dependabot opens its own PRs and cannot file an issue first, so issue-first is UNSATISFIABLE for
          # them -- not merely inconvenient. Exempting them explicitly is honest; the alternative was a gate
          # that had to stay toothless for everyone so that one author could pass it.
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            echo "::notice::Author is dependabot[bot]; issue-first does not apply to an automated bump."
            exit 0
          fi

          # closingIssuesReferences is ground truth: it reflects what GitHub actually BOUND, which is not the
          # same as what the body appears to say. A backticked `Closes #N` does not bind, and a closing keyword
          # in the TITLE is ignored entirely.
          #
          # Retried rather than defaulted. A check that cannot evaluate must not report success -- that is the
          # exact failure this job is being fixed for -- but one transient API blip should not block a merge.
          closes=""
          for attempt in 1 2 3; do
            if closes=$(gh pr view "$PR" --json closingIssuesReferences --jq '.closingIssuesReferences | length'); then
              break
            fi
            echo "::warning::Could not read closing references (attempt $attempt). Retrying."
            closes=""
            sleep 5
          done

          if [ -z "$closes" ]; then
            echo "::error::Could not read this PR's closing references after three attempts. Failing rather"
            echo "::error::than passing a check that did not run."
            exit 1
          fi

          if [ "$closes" -gt 0 ]; then
            echo "::notice::PR closes $closes issue(s)."
            exit 0
          fi

          # AGENTS.md admits BOTH forms: `Closes #N` for a PR that completes an issue, `Related to #N` for one
          # that touches it without finishing it. Only the first binds in GitHub, so the second has to be read
          # out of the body.
          if printf '%s' "$BODY" | grep -qiE '(related to|part of|towards) +#[0-9]+'; then
            echo "::notice::PR cites an issue without closing it (Related to #N). That satisfies issue-first."
            exit 0
          fi

          # Diagnostics before the failure, so the message says what is wrong rather than only that something is.
          if printf '%s' "$TITLE" | grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+'; then
            echo "::error::The TITLE contains a closing keyword. GitHub ignores those - move it into the body."
          fi

          if printf '%s' "$BODY" | grep -qE '`[^`]*(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+[^`]*`'; then
            echo "::error::A closing keyword appears inside backticks, which does not bind. Remove the backticks."
          fi

          if printf '%s' "$BODY" | grep -qiE '(settles|delivers|implements|completes|addresses) +#[0-9]+'; then
            echo "::error::Near-miss verb before an issue reference. Only close/fix/resolve bind."
          fi

          echo "::error::This PR cites no issue. Issue-first: add a plain 'Closes #N' or 'Related to #N' to"
          echo "::error::the body. Task specs and acceptance criteria belong in the issue, not in the PR."
          exit 1
