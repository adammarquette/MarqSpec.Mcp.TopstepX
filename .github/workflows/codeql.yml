name: CodeQL Security Analysis

on:
  # NO `branches:` filter, for the reason spelled out in ci.yml (gh#60): a filtered trigger gave a PR into a
  # non-integration base no run at all, which reads as CLEAN rather than as unchecked. Security analysis is
  # the last thing that should skip itself silently on a stacked PR.
  pull_request:
  push:
    branches: [develop, staging, main]
  schedule:
    # Run every Monday at 08:00 UTC to catch newly published CVEs.
    - cron: '0 8 * * 1'

permissions:
  contents: read
  actions: read  # required for CodeQL to fetch workflow run information

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # required to upload SARIF results

    strategy:
      fail-fast: false
      matrix:
        language:
          - csharp

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # MinVer needs tag history; without it the build stamps 0.0.0-alpha.0. Harmless for analysis, but a
          # shallow clone here would make this the one job whose build differs from every other (ADR-0001).
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # net10.0, matching ci.yml — a job that analyses a different build from the one CI gates is
          # analysing something nobody ships. The comment here previously justified installing an 8.0 SDK on
          # the grounds that "the library multi-targets net8.0". It does not: this is an application, and every
          # csproj declares net10.0 alone.
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build MarqSpec.Mcp.TopstepX.slnx --configuration Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
