# The local stack: one Postgres carrying both extensions, and the MCP server.
#
#   docker compose up -d
#
# Configuration comes from `.env` (copy `.env.example`). Every key forwarded below must be documented there,
# and every key documented there must be forwarded here -- a key that is documented but not forwarded is a
# setting that silently does nothing in a container, which is the hardest kind of configuration bug to see.

services:
  postgres:
    # timescaledb-ha bundles BOTH timescaledb and pgvector, which is what makes ADR-0004's "one Postgres"
    # practical rather than a compromise. Pinned to a major: an unpinned tag turns a database upgrade into
    # something that happens when you happen to pull.
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-topstepx}"
      # Defaulted so `docker compose up` works out of the box, the same local-development convenience as
      # Mcp__HttpBearerToken. Acceptable ONLY because the port below is bound to 127.0.0.1 -- the two are a
      # COUPLING, not independent choices: widening the bind means setting a real password in the same change.
      #
      # The asymmetry with the bearer token, stated rather than assumed: the token authenticates nothing at
      # the venue and has never had a value worth rotating, while this credential OWNS THE SCHEMA -- it can
      # read, write or drop the bar cache, the trade tape, coverage ledgers and indicator projections. The
      # loopback bind is the whole of what makes the default tolerable, and it is tolerable for the same
      # reason the token's is: nothing off this machine can present it (gh#421).
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-changeme-local}"
      POSTGRES_DB: "${POSTGRES_DB:-topstepx_mcp}"
    ports:
      # Exposed so `dotnet ef` and a local run can reach it without entering the network -- that reason is
      # unchanged by binding the address below; only which interfaces can reach it changes.
      #
      # The bind address is EXPLICIT, matching the server's port one service down. A bare "5432:5432"
      # publishes on 0.0.0.0 AND [::] -- every interface the host has -- which is what this line did until
      # gh#421, the same defect gh#415 fixed on 8080/8443. Unlike the MCP endpoint there
      # is no bearer token in front of this port at all, and a database credential is not read-only: it owns
      # the schema.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/home/postgres/pgdata/data
    healthcheck:
      # pg_isready, not a TCP probe: the port accepts connections a little before the server will answer, and
      # the app's first migration would land in that window and fail on an otherwise healthy stack.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-topstepx} -d ${POSTGRES_DB:-topstepx_mcp}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  server:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        # service_healthy, not service_started. Migrations run at startup, and "the container exists" is not
        # the same claim as "the database will answer".
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "${ConnectionStrings__Default:-Host=postgres;Port=5432;Database=topstepx_mcp;Username=topstepx;Password=changeme-local}"

      ProjectX__ApiKey: "${ProjectX__ApiKey:-}"
      ProjectX__ApiSecret: "${ProjectX__ApiSecret:-}"
      # Defaulted so `docker compose up` with credentials and no tier does not fail startup. The
      # application itself never defaults this (R-7.2): Unspecified fails when credentials are set,
      # because the wrong tier returns an empty universe rather than an error. This value is the same
      # local-development convenience as Mcp__HttpBearerToken below, and it is in a public repository.
      ProjectX__DataTier: "${ProjectX__DataTier:-Simulated}"
      ProjectX__BaseUrl: "${ProjectX__BaseUrl:-https://api.topstepx.com}"

      # The composed server is the HTTP one. Stdio is for a client launching the process directly, and a
      # long-lived container with nothing attached to its stdin would sit idle forever (ADR-0007).
      Mcp__Transport: "Http"
      # Defaulted so `docker compose up` works out of the box, exactly as POSTGRES_PASSWORD is.
      #
      # The token is REQUIRED whenever the HTTP transport is on (ADR-0007) and startup fails without one --
      # an endpoint carrying balances, positions and trade history is a data leak even though nothing here can
      # trade. This value is in a public repository.
      #
      # Defaulting it is a local-development convenience, and it is acceptable ONLY because the port below is
      # bound to 127.0.0.1. That is a COUPLING, not two independent choices: widening the bind address means
      # setting a real token in the same change. The sentence here used to assert the port was "published to
      # localhost" while the mapping published it to every interface, which is how the assumption survived
      # unexamined (gh#415).
      Mcp__HttpBearerToken: "${Mcp__HttpBearerToken:-changeme-local}"

      MarketData__SessionCloseCentral: "${MarketData__SessionCloseCentral:-16:00}"
      MarketData__Holidays: "${MarketData__Holidays:-}"
      MarketData__MaxRows: "${MarketData__MaxRows:-5000}"
      MarketData__Instruments: "${MarketData__Instruments:-ES,NQ}"
      # Off by default: the composed server is HTTP, and HTTP is not consent to record (ADR-0016).
      MarketData__RecordTape: "${MarketData__RecordTape:-false}"
      # Off by default: HTTP is not consent to warm either (ADR-0014, gh#350).
      MarketData__WarmIndicators: "${MarketData__WarmIndicators:-false}"

      Indicators__AtrPeriod: "${Indicators__AtrPeriod:-14}"
      Indicators__RsiPeriod: "${Indicators__RsiPeriod:-14}"
      Indicators__SmaPeriod: "${Indicators__SmaPeriod:-20}"
      Indicators__EmaPeriod: "${Indicators__EmaPeriod:-20}"
      Indicators__MacdSlowPeriod: "${Indicators__MacdSlowPeriod:-26}"
      Indicators__BollingerPeriod: "${Indicators__BollingerPeriod:-20}"

      # Detection defaults for get_key_levels. Source, PivotLookback and PivotRightLookback are also
      # per-call arguments on the tool; the width, the floor and the two caps are settable only here,
      # so every level this server reports is sized and filtered alike (ADR-0013). An unset Source keeps
      # HeikinAshiBody; a wrong one FAILS STARTUP -- in the binder for a bad name, in the option's own
      # validation for Unknown or a bare number (gh#459). The window is 20 left / 15 right — Bjorgum's
      # calibration, adopted by gh#245 — matching KeyLevelDetectionOptions and the catalogue.
      KeyLevels__Source: "${KeyLevels__Source:-HeikinAshiBody}"
      KeyLevels__PivotLookback: "${KeyLevels__PivotLookback:-20}"
      KeyLevels__PivotRightLookback: "${KeyLevels__PivotRightLookback:-15}"
      KeyLevels__ZoneAtrMultiple: "${KeyLevels__ZoneAtrMultiple:-0.5}"
      KeyLevels__MinSignificance: "${KeyLevels__MinSignificance:-0.5}"
      KeyLevels__MaxZoneWidthPercent: "${KeyLevels__MaxZoneWidthPercent:-2.5}"
      KeyLevels__MaxLevels: "${KeyLevels__MaxLevels:-12}"
      # Per-method confluence weights. Unlisted methods weigh 1; do not encode the family discount here.
      KeyLevels__Weights__swing: "${KeyLevels__Weights__swing:-1}"
      KeyLevels__Weights__session: "${KeyLevels__Weights__session:-1}"
      KeyLevels__Weights__pivot-classic: "${KeyLevels__Weights__pivot-classic:-1}"
      KeyLevels__Weights__pivot-fibonacci: "${KeyLevels__Weights__pivot-fibonacci:-1}"
      KeyLevels__Weights__pivot-camarilla: "${KeyLevels__Weights__pivot-camarilla:-1}"
      KeyLevels__Weights__pivot-woodie: "${KeyLevels__Weights__pivot-woodie:-1}"
      KeyLevels__Weights__pivot-demark: "${KeyLevels__Weights__pivot-demark:-1}"

      Embeddings__ApiKey: "${Embeddings__ApiKey:-}"
      Embeddings__Model: "${Embeddings__Model:-embed-v4.0}"

      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"

      # HTTPS ONLY. What is established: a client that requires HTTPS could not connect to this stack at
      # all, because it served nothing but plaintext -- and a bearer token sent in clear is a credential
      # anyone on the path can replay, whatever any client demands (gh#416). What is REPORTED and NOT
      # verified here: that Claude Cowork is such a client and refuses to register a non-TLS endpoint as a
      # connector. gh#416 says so in its own words -- "I have not independently verified Cowork's
      # requirement, and this issue does not rest on it" -- and neither does this file.
      #
      # THE EMPTY VALUE BELOW IS LOAD-BEARING, AND DELETING THE LINE RE-OPENS THE PLAINTEXT PORT.
      # mcr.microsoft.com/dotnet/aspnet:10.0 sets ASPNETCORE_HTTP_PORTS=8080 in the IMAGE, so merely
      # ceasing to name it here leaves the base image's value in the environment. Measured: with only
      # ASPNETCORE_HTTPS_PORTS: "8443" set, the server reported BOTH `Now listening on: http://[::]:8080`
      # and `https://[::]:8443` -- a plaintext MCP endpoint still serving, from a variable this file no
      # longer mentioned. The override has to be explicit.
      #
      # A surviving plaintext port is a port to reach by mistake, and the mistake leaks balances, positions
      # and trade history. 8443 rather than 8080 so the scheme and the number agree and a URL cannot be half
      # right: the old plaintext one is not quietly reused under a new scheme. Measured on the wrong scheme
      # at the right port -- http:// against 8443 -- the client gets `The underlying connection was closed`,
      # which is a diagnosis nobody enjoys; moving the number keeps anyone from meeting it.
      ASPNETCORE_HTTP_PORTS: ""
      ASPNETCORE_HTTPS_PORTS: "8443"

      # The certificate is LOCALLY TRUSTED, not publicly issued: the maintainer scoped this to a client on
      # the SAME MACHINE -- not Anthropic's cloud, not a LAN -- so there is no public hostname to certify and
      # no ACME challenge to answer. A genuinely remote instance is a different operational story and is not
      # decided here. It comes from mkcert, a local CA installed once into the host trust store:
      #
      #   mkcert -install                                                       # once, per host
      #   mkcert -cert-file ./certs/localhost.crt -key-file ./certs/localhost.key localhost 127.0.0.1 ::1
      #   openssl pkcs12 -export -out ./certs/localhost.pfx \
      #     -inkey ./certs/localhost.key -in ./certs/localhost.crt \
      #     -certfile "$(mkcert -CAROOT)/rootCA.pem" -passout "pass:$Kestrel__Certificates__Default__Password"
      #   rm ./certs/localhost.key                                              # the PFX carries it, encrypted
      #
      # NOT `dotnet dev-certs`, and the reason is measured rather than aesthetic: that certificate is a
      # self-signed LEAF carrying `basicConstraints: CA:FALSE`, so OpenSSL cannot use it as a trust anchor at
      # all. A Node-based MCP client refused it with `UNABLE_TO_VERIFY_LEAF_SIGNATURE`, and kept refusing it
      # with NODE_EXTRA_CA_CERTS pointed straight at the certificate -- there is no client-side setting that
      # rescues it. mkcert issues a leaf from a real CA, which both trust stores can anchor on. See ADR-0007.
      #
      # The leaf mkcert issues here expires 2028-12-02 UTC. Re-issue past that date; nothing rotates it.
      Kestrel__Certificates__Default__Path: "/https/localhost.pfx"
      # NO VALUE SHIPS HERE, deliberately. A PFX password is a credential; POSTGRES_PASSWORD's and
      # Mcp__HttpBearerToken's local defaults are tolerable because a loopback port is what they guard, and a
      # default that unlocks a private key is not the same kind of thing. THIS REPOSITORY IS PUBLIC.
      #
      # `:-` AND NOT `:?`, AND THAT IS A CORRECTION RATHER THAN A PREFERENCE. Compose interpolates the WHOLE
      # FILE before it selects a service, so a `:?` here failed commands that never start this one --
      # measured with no `.env`: `docker compose config postgres` exited 1 with a certificate error, and so
      # did `docker compose -f docker-compose.yml -f docker-compose.dev.yml config sdk`, which is the repo's
      # documented test loop and, per docker-compose.dev.yml, the only way to run the suite on a host where
      # Application Control blocks fresh assemblies. `docker compose up -d postgres` is also the command the
      # server's own startup warning prints. Scoping it to this service was tried and does not exist: an
      # `env_file` entry with `required: true` failed BOTH of those commands identically.
      #
      # So the requirement is enforced where it belongs -- at the server's own startup -- and the two
      # failures are written down here because one of them is misleading:
      #
      #   certs/ empty or absent  ->  FileNotFoundException naming /https/localhost.pfx. Clear; do the setup.
      #   PFX present, password unset or wrong
      #                           ->  CryptographicException: "The certificate data cannot be read with the
      #                               provided password, the password may be incorrect." An UNSET password
      #                               arrives as an empty one and produces exactly this, so "may be
      #                               incorrect" also means "may be missing". Check .env before the PFX.
      Kestrel__Certificates__Default__Password: "${Kestrel__Certificates__Default__Password:-}"

      Logging__LogLevel__Default: "${Logging__LogLevel__Default:-Information}"
    volumes:
      # The DIRECTORY, not the file. Docker creates a missing bind source as a directory, so mounting
      # ./certs/localhost.pfx directly would silently manufacture a directory of that name and Kestrel would
      # fail on it obscurely; mounting the directory leaves the failure as a FileNotFoundException naming
      # /https/localhost.pfx, which says what to do. Read-only: the server never writes a certificate.
      - "./certs:/https:ro"
    ports:
      # The bind address is EXPLICIT, and the whole defence depends on it. A bare "8443:8443" publishes on
      # 0.0.0.0 -- every interface the host has -- which is what this file did on 8080 while the comment above
      # claimed localhost. Three defaults composed into an exposure nobody chose: the transport is Http here,
      # the token defaults, and the port was open to the network. Anything that could route to the host could
      # read balances, positions and trade history with a token published in a public repository (gh#415).
      #
      # TLS does not replace this bind and does not license widening it. It is confidentiality on the wire;
      # the token is authorisation, and loopback is what makes the token's local default tolerable.
      - "127.0.0.1:8443:8443"

volumes:
  postgres-data:
